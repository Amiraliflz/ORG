apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'ir.mrshoofer.ops'
    compileSdk 34

    defaultConfig {
        applicationId 'ir.mrshoofer.ops'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'API_BASE', '"https://mrshoofer.com"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'API_BASE', '"https://mrshoofer.com"'
        }
        debug {
            // Always prefer production VPS; local/USB remain failover candidates in-app
            buildConfigField 'String', 'API_BASE', '"https://mrshoofer.com"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

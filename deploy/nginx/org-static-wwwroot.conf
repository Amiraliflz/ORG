# Serve public static assets from disk — survives app restarts / upstream blips.
# Requires: root /var/www/org/wwwroot; include inside mrshoofer.com server block.
location ^~ /css/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}
location ^~ /vendor/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}
location ^~ /js/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}
location ^~ /libs/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}
location ^~ /img/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}
location ^~ /farsi-fonts/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}
location = /favicon.ico {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}
location = /robots.txt {
    default_type text/plain;
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
}
location = /llms.txt {
    default_type text/plain;
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
}

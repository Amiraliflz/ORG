# Live VPS nginx — ArvanCloud terminates TLS; origin HTTP :80 and :8080 → sale app :5055.
# Canonical: https://mrshoofer.com
# isic.mrshoofer.ir stays on sites-enabled/isic-entry (X-Partner: isic).

# Payment host — keep proxied (do not redirect callbacks)
server {
    listen 80;
    listen 8080;
    server_name pay.mrshoofer.ir;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / {
        return 301 https://mrshoofer.com/;
    }

    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:5055;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }
}

# Canonical public sale site (.com)
server {
    listen 80;
    listen 8080;
    server_name mrshoofer.com www.mrshoofer.com;

    # Dead WordPress / cPanel URLs — 410 so GSC drops them (not soft-404)
    location ~* ^/(index\.php|cgi-sys/|cgi-bin/|wp-|xmlrpc\.php) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 410;
    }

    location / {
        proxy_pass http://127.0.0.1:5055;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Arvan terminates TLS; origin is HTTP. Empty X-Forwarded-Proto makes
        # Kestrel think the request is HTTP and 301 to the same HTTPS URL.
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}

# Legacy .ir — 301 at nginx (no app hop) so Googlebot gets a fast redirect
server {
    listen 80;
    listen 8080;
    server_name mrshoofer.ir www.mrshoofer.ir;

    location ~* ^/(index\.php|cgi-sys/|cgi-bin/|wp-|xmlrpc\.php) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 410;
    }

    return 301 https://mrshoofer.com$request_uri;
}

# Other aliases → canonical https://mrshoofer.com
server {
    listen 80;
    listen 8080;
    server_name sale.mrshoofer.ir sale.shoofer.taxi;
    return 301 https://mrshoofer.com$request_uri;
}

# Dedicated origin for Arvan mrshoofer.ir / www only.
# Always 301, even if the CDN rewrites Host to mrshoofer.com (Googlebot).
# Do not point pay, webapp, isic, or .com at this port.
server {
    listen 8088 default_server;
    listen [::]:8088 default_server;
    server_name _;

    location ~* ^/(index\.php|cgi-sys/|cgi-bin/|wp-|xmlrpc\.php) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 410;
    }

    return 301 https://mrshoofer.com$request_uri;
}

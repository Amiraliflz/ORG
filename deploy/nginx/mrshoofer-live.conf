# Live VPS nginx — ArvanCloud terminates TLS; origin HTTP :80 and :8080 → sale app :5055.
# Canonical: https://mrshoofer.com
# isic.mrshoofer.ir stays on sites-enabled/isic-entry (X-Partner: isic).

# Payment host — keep proxied (do not redirect callbacks)
server {
    listen 80;
    listen 8080;
    server_name pay.mrshoofer.ir;

    # Defer Zarinpal DNS to request time so nginx still starts if resolver is slow at boot.
    resolver 127.0.0.53 valid=300s ipv6=off;
    resolver_timeout 5s;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / {
        return 301 https://mrshoofer.com/;
    }

    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        add_header X-Robots-Tag "noindex, nofollow" always;
        # Allow crawl of / so Google sees the 301 → .com (clears Domain-property "Blocked by robots").
        # Keep payment paths Disallow; X-Robots-Tag still noindex on all responses.
        return 200 "User-agent: *\nDisallow: /pg/\nDisallow: /Payment/\n";
    }

    # Zarinpal merchant domain forwards checkout here; proxy to gateway.
    location /pg/ {
        set $zarinpal_upstream payment.zarinpal.com;
        proxy_pass https://$zarinpal_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name payment.zarinpal.com;
        proxy_set_header Host payment.zarinpal.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_buffering on;
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</body>' '<script>document.addEventListener("DOMContentLoaded",function(){var f=document.getElementById("payment-form");if(f)f.submit();});</script></body>';
    }

    location / {
        proxy_pass http://127.0.0.1:5055;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }
}

# Canonical public sale site (.com)
server {
    listen 80;
    listen 8080;
    server_name mrshoofer.com www.mrshoofer.com;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Dead WordPress / cPanel URLs — 410 so GSC drops them (not soft-404)
    location ~* ^/(index\.php|cgi-sys/|cgi-bin/|wp-|xmlrpc\.php) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 410;
    }

    # Always-on Ops Agent — works when the ASP.NET app is hard-down
    include /etc/nginx/snippets/org-ops-agent.conf;

    root /var/www/org/wwwroot;
    include /etc/nginx/snippets/org-static-wwwroot.conf;

    location / {
        proxy_pass http://127.0.0.1:5055;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Arvan terminates TLS; origin is HTTP. Empty X-Forwarded-Proto makes
        # Kestrel think the request is HTTP and 301 to the same HTTPS URL.
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

# Legacy .ir — 301 at nginx (no app hop) so Googlebot gets a fast redirect
server {
    listen 80;
    listen 8080;
    server_name mrshoofer.ir www.mrshoofer.ir;

    # Temporary: GSC Change-of-Address fetch diagnosis (see conf.d/00-migration-debug-format.conf)
    access_log /var/log/nginx/migration_debug.log migration_debug;

    root /var/www/org/wwwroot;
    include /etc/nginx/snippets/org-static-wwwroot.conf;

    location ~* ^/(index\.php|cgi-sys/|cgi-bin/|wp-|xmlrpc\.php) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 410;
    }

    # GSC .ir property: sitemap still from app (dynamic); robots/llms from disk via snippet above
    location ~ ^/sitemap(-.*)?\.xml$ {
        proxy_pass http://127.0.0.1:5055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 301 https://mrshoofer.com$request_uri;
    }
}

# Other aliases → canonical https://mrshoofer.com
server {
    listen 80;
    listen 8080;
    server_name sale.mrshoofer.ir sale.shoofer.taxi;
    return 301 https://mrshoofer.com$request_uri;
}


# Always-301 origin for Arvan mrshoofer.ir / www (Googlebot Host rewrite).
# Point only @ and www of mrshoofer.ir at port 8088. Never pay/webapp/com.
server {
    listen 8088 default_server;
    listen [::]:8088 default_server;
    server_name _;

    # Temporary: GSC Change-of-Address fetch diagnosis
    access_log /var/log/nginx/migration_debug.log migration_debug;

    location ~* ^/(index\.php|cgi-sys/|cgi-bin/|wp-|xmlrpc\.php) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 410;
    }

    root /var/www/org/wwwroot;

    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /llms.txt {
        default_type text/plain;
        try_files /llms.txt =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    location ~ ^/sitemap(-.*)?\.xml$ {
        proxy_pass http://127.0.0.1:5055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 301 https://mrshoofer.com$request_uri;
    }
}

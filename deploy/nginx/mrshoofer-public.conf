# Managed by deploy — public sale site hostnames (ArvanCloud origin or nginx on VPS).
# Canonical: https://mrshoofer.com
# Legacy 301: mrshoofer.ir, www.mrshoofer.ir, www.mrshoofer.com → mrshoofer.com
#
# If ArvanCloud CDN is in front, mirror these rules in the CDN panel:
#   - Primary domain: mrshoofer.com → origin (app :5055 or upstream)
#   - Redirect mrshoofer.ir/* → https://mrshoofer.com/$path (301)
#   - Redirect www.mrshoofer.ir/* and www.mrshoofer.com/* → https://mrshoofer.com/$path
#
# App-level fallback: CanonicalHostMiddleware (Seo:LegacyHosts in appsettings.json).

upstream org_sale_backend {
    server 127.0.0.1:5055;
    keepalive 32;
}

# --- Canonical HTTPS ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mrshoofer.com;

    # ssl_certificate     /etc/ssl/mrshoofer.com/fullchain.pem;
    # ssl_certificate_key /etc/ssl/mrshoofer.com/privkey.pem;

    location ~* ^/(index\.php|cgi-sys/|cgi-bin/|wp-|xmlrpc\.php) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 410;
    }

    location / {
        proxy_pass http://org_sale_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# --- Legacy → canonical (301) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mrshoofer.ir www.mrshoofer.ir www.mrshoofer.com;

    location ~* ^/(index\.php|cgi-sys/|cgi-bin/|wp-|xmlrpc\.php) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 410;
    }

    return 301 https://mrshoofer.com$request_uri;
}

# --- HTTP → HTTPS canonical ---
server {
    listen 80;
    listen [::]:80;
    server_name mrshoofer.com mrshoofer.ir www.mrshoofer.ir www.mrshoofer.com;
    return 301 https://mrshoofer.com$request_uri;
}

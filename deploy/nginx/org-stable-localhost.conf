# Stable localhost front for ORG so peer apps always call :5055.
# Blue/green instances bind 15055 / 15056; this proxy never moves.
#
# Requires sibling file (managed by deploy):
#   /etc/nginx/conf.d/org-backend-active.conf
# which defines: upstream org_app_backend { server 127.0.0.1:PORT; }
#
# Install:
#   DEPLOY_PASS=... ./deploy/scripts/install-stable-localhost-proxy.sh

server {
    listen 127.0.0.1:5055;
    server_name _;

    location / {
        proxy_pass http://org_app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# Temporary GSC Change-of-Address debug (remove after diagnosis).
# Installed to /etc/nginx/conf.d/ — log_format must live in http{} context.
log_format migration_debug
    '$time_iso8601 '
    'remote=$remote_addr '
    'xff="$http_x_forwarded_for" '
    'host="$host" '
    'method="$request_method" '
    'request="$request" '
    'status=$status '
    'bytes=$body_bytes_sent '
    'ua="$http_user_agent" '
    'ref="$http_referer" '
    'rt=$request_time';
